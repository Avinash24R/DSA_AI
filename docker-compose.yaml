services:
  postgres:
    image: postgres:17
    container_name: DSA_DB
    restart: unless-stopped
    environment:
      - POSTGRES_USER=coolUser
      - POSTGRES_PASSWORD=coolUserPassword
      - POSTGRES_DB=DSA_agent
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coolUser -d DSA_agent"]
      interval: 10s
      timeout: 5s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4
    container_name: dsa_pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=adminPassword
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
  roadmap-seeder:
    image: python:3.13-slim
    container_name: dsa_roadmap_seeder

    working_dir: /app

    volumes:
      - ./scripts:/app/scripts
      - ./db:/app/db
      - ./requirements.txt:/app/requirements.txt
    environment:
      - POSTGRES_DB=DSA_agent
      - POSTGRES_USER=coolUser
      - POSTGRES_PASSWORD=coolUserPassword
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
      pip install --no-cache-dir -r requirements.txt && python scripts/setup.py
      "
volumes:
  postgres_data: