<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile - DSA AI Tutor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="application">

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                <i class="bi bi-cpu"></i>
            </div>

            <span>
                DSA <strong>AI Tutor</strong>
            </span>

        </div>


        <nav class="navigation">

            <a
                href="index.html"
                class="nav-item"
            >
                <i class="bi bi-house"></i>
                Home
            </a>

            <a
                href="problems.html"
                class="nav-item"
            >
                <i class="bi bi-code-square"></i>
                Problems
            </a>

            <a
                href="progress.html"
                class="nav-item"
            >
                <i class="bi bi-graph-up"></i>
                Progress
            </a>

            <a
                href="user.html"
                class="nav-item active"
            >
                <i class="bi bi-person"></i>
                Profile
            </a>

        </nav>

    </aside>


    <main class="main">

        <header class="topbar">

            <div>

                <small>
                    Account
                </small>

                <h3>
                    Profile
                </h3>

            </div>

        </header>


        <div class="content">

            <section class="card-box profile-page">

                <div class="profile-avatar-large">

                    <span id="profileAvatar">
                        S
                    </span>

                </div>


                <h1 id="profileName">
                    Student
                </h1>


                <p
                    id="profileEmail"
                    class="text-secondary"
                >
                    student@example.com
                </p>


                <span
                    id="profileLevel"
                    class="profile-level"
                >
                    Beginner
                </span>


                <div class="profile-grid">

                    <div>

                        <small>
                            XP
                        </small>

                        <strong id="profileXp">
                            0
                        </strong>

                    </div>


                    <div>

                        <small>
                            Accuracy
                        </small>

                        <strong id="profileAccuracy">
                            0%
                        </strong>

                    </div>


                    <div>

                        <small>
                            Streak
                        </small>

                        <strong id="profileStreak">
                            0
                        </strong>

                    </div>

                </div>

            </section>

            <section class="card-box">

                <div class="section-header">

                    <div>

                        <small class="eyebrow">
                            KNOWLEDGE
                        </small>
                        <h3>
                            Saved Topic Summaries
                        </h3>
                    </div>
                </div>
                <div id="savedSummaries">

                    Loading summaries...

                </div>

            </section>
            <div>
                <small>Codeforces</small>

                <strong id="profileCodeforces">
                    -
                </strong>
            </div>

        </div>

    </main>

</div>
<script src="app.js"></script>

</body>
</html>
