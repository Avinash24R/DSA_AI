<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Progress - DSA AI Tutor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="application">

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                <i class="bi bi-cpu"></i>
            </div>

            <span>
                DSA <strong>AI Tutor</strong>
            </span>

        </div>


        <nav class="navigation">

            <a
                href="index.html"
                class="nav-item"
            >
                <i class="bi bi-house"></i>
                Home
            </a>

            <a
                href="problems.html"
                class="nav-item"
            >
                <i class="bi bi-code-square"></i>
                Problems
            </a>

            <a
                href="progress.html"
                class="nav-item active"
            >
                <i class="bi bi-graph-up"></i>
                Progress
            </a>

            <a
                href="user.html"
                class="nav-item"
            >
                <i class="bi bi-person"></i>
                Profile
            </a>

        </nav>

    </aside>


    <main class="main">

        <header class="topbar">

            <div>

                <small>
                    Learning
                </small>

                <h3>
                    Your Progress
                </h3>

            </div>

        </header>


        <div class="content">

            <section class="stats-grid-large">

                <div class="card-box stat-card">

                    <small>
                        Skill Score
                    </small>

                    <strong id="skillScore">
                        0
                    </strong>

                    <span>
                        / 100
                    </span>

                </div>


                <div class="card-box stat-card">

                    <small>
                        Problems Solved
                    </small>

                    <strong id="solved">
                        0
                    </strong>

                </div>


                <div class="card-box stat-card">

                    <small>
                        Attempts
                    </small>

                    <strong id="attempts">
                        0
                    </strong>

                </div>


                <div class="card-box stat-card">

                    <small>
                        Accuracy
                    </small>

                    <strong id="metricAccuracy">
                        0%
                    </strong>

                </div>

            </section>


            <section class="card-box">

                <div class="section-header">

                    <div>

                        <small class="eyebrow">
                            SKILLS
                        </small>

                        <h3>
                            Topic Progress
                        </h3>

                    </div>

                </div>


                <div id="progressList">

                    Loading progress...

                </div>

            </section>

        </div>

    </main>

</div>
<script src="app.js"></script>

</body>
</html>
