<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start · DSA AI Tutor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="onboarding" class="form-page">
  <div class="form-card">
    <div class="form-brand">
      <div class="brand-icon"><i class="bi bi-cpu"></i></div>
      <h1>DSA AI Tutor</h1>
      <p>A personalized DSA coach that teaches a topic, gives you a real problem, and tracks what you learn.</p>
    </div>

    <form id="startForm">
      <div class="form-group">
        <label for="onboardingName">Name</label>
        <input id="onboardingName" class="input" required placeholder="Your name">
      </div>
      <div class="form-group">
        <label for="onboardingEmail">Email</label>
        <input id="onboardingEmail" class="input" type="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="onboardingLevel">Current DSA level</label>
        <select id="onboardingLevel" class="select">
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
      </div>
      <div class="form-group">
        <label for="onboardingCodeforces">Codeforces handle</label>
        <input id="onboardingCodeforces" class="input" required placeholder="your_codeforces_handle">
      </div>
      <div class="form-help">The handle is used only to verify submissions for the problem assigned by the AI.</div>
      <button id="startLearningBtn" class="btn btn-primary" type="submit" style="width:100%">
        <i class="bi bi-play-fill"></i> Start learning
      </button>
    </form>
  </div>
</section>

<section id="existingSession" class="form-page" style="display:none">
  <div class="form-card" style="text-align:center">
    <div class="form-brand">
      <div class="brand-icon"><i class="bi bi-check2-circle"></i></div>
      <h1>Welcome back</h1>
      <p id="existingSessionText">Your learning session is ready.</p>
    </div>
    <div class="action-row" style="justify-content:center">
      <a class="btn btn-primary" href="index.html">Open Home</a>
      <button class="btn btn-danger" data-reset-session>Start fresh</button>
    </div>
  </div>
</section>

<div id="appToast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
